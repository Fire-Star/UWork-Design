  <div class="composer is-hero" id="composer">
    <div class="composer-workspace-row">
      <div class="picker">
        <button type="button" class="workspace-chip picker-trigger" id="composer-workspace" aria-haspopup="listbox" aria-expanded="false" aria-controls="composer-workspace-menu" aria-label="选择工作区">
          <svg class="chip-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-folder-open"/></svg>
          <span class="picker-value">UWork-Design</span>
          <svg class="chip-chevron" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </button>
        <div class="picker-menu" id="composer-workspace-menu" role="listbox" aria-label="选择工作区" hidden></div>
      </div>
      <div class="picker">
        <button type="button" class="preset-chip picker-trigger" id="preset" aria-haspopup="listbox" aria-expanded="false" aria-controls="preset-menu" aria-label="模式">
          <svg class="chip-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-preset"/></svg>
          <span class="picker-value">PTC 模式</span>
          <svg class="chip-chevron" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </button>
        <div class="picker-menu" id="preset-menu" role="listbox" aria-label="模式" hidden>
          <button type="button" class="picker-option" role="option" data-value="PTC 模式" aria-selected="true">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-preset"/></svg>
            <span class="picker-label">PTC 模式</span>
            <svg class="picker-check" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-check"/></svg>
          </button>
          <button type="button" class="picker-option" role="option" data-value="标准模式" aria-selected="false">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-preset"/></svg>
            <span class="picker-label">标准模式</span>
            <svg class="picker-check" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-check"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="composer-card">
      <label class="vh" for="composer-input">消息</label>
      <textarea id="composer-input" class="composer-input" rows="1" placeholder="描述你想要构建的内容, / 调用指令, @ 文件或对话"></textarea>
      <div class="composer-row">
        <div class="composer-tools">
          <button type="button" class="add" data-action="attach" aria-label="添加文件或调用指令">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-plus"/></svg>
          </button>
          <div class="picker-menu command-menu" id="command-menu" role="listbox" aria-label="添加文件或调用指令" hidden>
            <button type="button" class="picker-option" role="option" data-action="command-note" data-note="这个原型不能打开系统文件选择器">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-paperclip"/></svg>
              <span class="picker-label">添加文件或图片</span>
            </button>
            <button type="button" class="picker-option" role="option" data-action="command-note" data-note="在输入框里输入 / 查看可用指令">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-code"/></svg>
              <span class="picker-label">调用指令</span>
            </button>
            <button type="button" class="picker-option" role="option" data-action="command-note" data-note="在输入框里输入 @ 引用文件或会话">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-link"/></svg>
              <span class="picker-label">引用文件或会话</span>
            </button>
          </div>
          <button type="button" class="access-trigger picker-trigger" id="access" aria-haspopup="listbox" aria-expanded="false" aria-controls="access-menu" aria-label="访问模式，当前：工作区内修改">
            <span class="access-icon" id="access-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><use href="#i-perm-workspace"/></svg></span>
            <span class="picker-value">工作区内修改</span>
            <svg class="chip-chevron" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron-down"/></svg>
          </button>
          <div class="picker-menu" id="access-menu" role="listbox" aria-label="权限" hidden>
            <button type="button" class="picker-option" role="option" data-value="read" aria-selected="false">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-perm-readonly"/></svg>
              <span class="picker-label">仅可查看</span>
              <svg class="picker-check" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-check"/></svg>
            </button>
            <button type="button" class="picker-option" role="option" data-value="workspace" aria-selected="true">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-perm-workspace"/></svg>
              <span class="picker-label">工作区内修改</span>
              <svg class="picker-check" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-check"/></svg>
            </button>
            <button type="button" class="picker-option" role="option" data-value="full" aria-selected="false">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-perm-full"/></svg>
              <span class="picker-label">完全权限</span>
              <svg class="picker-check" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-check"/></svg>
            </button>
            <button type="button" class="picker-option" role="option" data-value="auto" aria-selected="false">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-perm-auto"/></svg>
              <span class="picker-label">自动审查</span>
              <svg class="picker-check" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-check"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-end">
          <div class="picker">
            <button type="button" class="picker-trigger" id="model" aria-haspopup="listbox" aria-expanded="false" aria-controls="model-menu" aria-label="模型">
              <span class="picker-value">DeepSeek-V4.1-Flash High</span>
              <svg class="chip-chevron" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron-down"/></svg>
            </button>
            <div class="picker-menu" id="model-menu" role="listbox" aria-label="模型" hidden>
              <button type="button" class="picker-option" role="option" data-value="DeepSeek-V4.1-Flash High" aria-selected="true"><span class="picker-label">DeepSeek-V4.1-Flash High</span><svg class="picker-check" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-check"/></svg></button>
              <button type="button" class="picker-option" role="option" data-value="DeepSeek-V4.1-Flash" aria-selected="false"><span class="picker-label">DeepSeek-V4.1-Flash</span><svg class="picker-check" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-check"/></svg></button>
              <button type="button" class="picker-option" role="option" data-value="DeepSeek-V4-Flash High" aria-selected="false"><span class="picker-label">DeepSeek-V4-Flash High</span><svg class="picker-check" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-check"/></svg></button>
            </div>
          </div>
          <button type="button" class="send is-idle" id="send-btn" aria-label="发送消息">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-send"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="composer-stats" id="stats" hidden></div>
  </div>
