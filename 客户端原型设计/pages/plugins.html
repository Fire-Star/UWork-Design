        <section id="view-plugins" hidden aria-labelledby="view-title">
          <div class="plugins od-scroll">
            <div class="plugin-head">
              <div class="tabs" role="tablist" aria-label="插件">
                <button type="button" class="tab" id="tab-installed" role="tab" data-action="plugin-tab" data-tab="installed" aria-selected="false" aria-controls="plugin-mount">已安装</button>
                <button type="button" class="tab" id="tab-discover" role="tab" data-action="plugin-tab" data-tab="discover" aria-selected="true" aria-controls="plugin-mount">发现</button>
              </div>
              <label class="search">
                <span>搜索</span>
                <input id="plugin-search" type="search" placeholder="名称、说明或包名" autocomplete="off">
              </label>
            </div>
            <p class="empty" id="plugin-empty" hidden>没有匹配的插件。换个词，或清空搜索后再看。</p>
            <div id="plugin-mount"></div>
          </div>
        </section>
