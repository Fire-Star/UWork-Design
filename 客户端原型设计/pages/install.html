  <dialog id="install-dialog" aria-labelledby="install-title">
    <div class="dialog-head">
      <h2 id="install-title">安装插件</h2>
      <button type="button" class="icon-btn" data-action="close-install" aria-label="关闭">
        <svg class="od-icon icon-16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dialog-body">
      <p id="install-body"></p>
      <p class="caption">确认后只在这个页面里记为已安装，不会下载或执行任何包。</p>
      <div class="dialog-actions">
        <button type="button" class="secondary" data-action="close-install">取消</button>
        <button type="button" class="primary" data-action="confirm-install" data-autofocus>安装</button>
      </div>
    </div>
  </dialog>
