<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSH Desktop</title>
  <style>
    /* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
       Put this @layer first; product CSS outside the layer wins ordinary layout rules.
       Native hidden and closed-dialog states take precedence over component display rules. */
    @layer od-layout {
      [hidden]:not([hidden="until-found" i]) { display: none !important; }
      dialog:not([open]) { display: none !important; }

      :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

      .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
      .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
      .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
      .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
      .od-fill    { flex: 1 1 0; min-width: 0; }
      .od-fixed   { flex: none; }
      .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

      .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
      :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
      .od-tile { display: grid; grid-template-rows: auto 1fr; }
      :where(.od-tile) > :where(*) { display: block; }

      .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
      .od-media-cover { object-fit: cover; }

      .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

      .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .od-clamp-2 { -webkit-line-clamp: 2; }
      .od-clamp-3 { -webkit-line-clamp: 3; }
      .od-lines-2 { min-height: calc(2 * 1.4em); }
      .od-nowrap  { white-space: nowrap; }
      .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

      .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
      .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

      .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
                 padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
      .od-rail::-webkit-scrollbar { display: none; }
      :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
      :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

      .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
      .od-touch  { min-width: 44px; min-height: 44px; }
    }
    :root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
    /* /OD-LAYOUT-PRIMITIVES v1 */

    @font-face {
      font-family: "Montserrat";
      src: url("assets/fonts/montserrat-light.woff2") format("woff2");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Montserrat";
      src: url("assets/fonts/montserrat-regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Montserrat";
      src: url("assets/fonts/montserrat-medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #f5f6f8;
      --sidebar: #f3f4f6;
      --label: #1c1c1e;
      --secondary: #3a3a3c;
      --caption: #8e8e93;
      --border: rgba(0, 0, 0, 0.1);
      --border-soft: rgba(0, 0, 0, 0.06);
      --hover: rgba(0, 0, 0, 0.05);
      --active: #e6e7ea;
      --card: #ffffff;
      --layer: #ffffff;
      --selector: #ffffff;
      --frame: #f7f7f8;
      --frame-text: #1c1c1e;
      --frame-hover: rgba(0, 0, 0, 0.06);
      --menu: #ffffff;
      --menu-text: #1c1c1e;
      --menu-hover: #f2f2f3;
      --menu-muted: #8e8e93;
      --menu-line: rgba(0, 0, 0, 0.08);
      --chip: #eef0f3;
      --picker: #ffffff;
      --picker-selected: rgba(0, 0, 0, 0.06);
      --composer-ring: rgba(0, 0, 0, 0.16);
      --toast-bg: #1c1c1e;
      --toast-text: #ffffff;
      --send: #3b6fe0;
      --send-hover: #325fb8;
      --info: #3b6fe0;
      --danger: #e5484d;
      --ok: #1f8f4e;
      --on-send: #ffffff;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --brand: "Montserrat", var(--font);
      --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-panel: 28px;
      --shadow-soft: 0 10px 28px rgba(0, 0, 0, 0.08);
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --bg: #151517;
      --sidebar: #1b1b1c;
      --label: #f9fafb;
      --secondary: #cfd3d6;
      --caption: #81858c;
      --border: rgba(255, 255, 255, 0.12);
      --border-soft: rgba(255, 255, 255, 0.06);
      --hover: rgba(255, 255, 255, 0.08);
      --active: #43454a;
      --card: #2c2c2e;
      --layer: #232324;
      --selector: #353638;
      --frame: #232323;
      --frame-text: #f9fafb;
      --frame-hover: rgba(255, 255, 255, 0.08);
      --menu: #2c2c2e;
      --menu-text: #f9fafb;
      --menu-hover: rgba(255, 255, 255, 0.08);
      --menu-muted: #81858c;
      --menu-line: rgba(255, 255, 255, 0.1);
      --chip: rgba(255, 255, 255, 0.08);
      --picker: #353638;
      --picker-selected: rgba(255, 255, 255, 0.12);
      --composer-ring: rgba(255, 255, 255, 0.22);
      --toast-bg: #43454a;
      --toast-text: #f9fafb;
      --send: #4176e6;
      --send-hover: #4868b2;
      --info: #7aaaff;
      --danger: #f25a5a;
      --ok: #4ed17e;
      --on-send: #ffffff;
      --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.28);
      color-scheme: dark;
    }
    .brand-mark, .hero-mark { filter: invert(1); }
    html[data-theme="dark"] .brand-mark,
    html[data-theme="dark"] .hero-mark { filter: none; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--label);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled, [aria-disabled="true"] { cursor: default; }
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--info);
      outline-offset: 2px;
    }
    .icon-16 { --od-icon-size: 16px; }
    .icon-18 { --od-icon-size: 18px; }
    .lucide {
      display: inline-block;
      width: var(--od-icon-size, 16px);
      height: var(--od-icon-size, 16px);
      flex: none;
      background-color: currentColor;
      -webkit-mask: var(--icon) center / contain no-repeat;
      mask: var(--icon) center / contain no-repeat;
      -webkit-mask-mode: alpha;
      mask-mode: alpha;
    }
    .vh {
      display: block;
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .skip {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 80;
      transform: translateY(-140%);
      background: var(--label);
      color: #111111;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 8px 12px;
    }
    .skip:focus { transform: none; }

    .shell {
      display: grid;
      grid-template-rows: 36px minmax(0, 1fr);
      height: 100dvh;
      min-height: 0;
      background: var(--bg);
    }
    .framebar {
      position: relative;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      padding-left: 6px;
      background: var(--frame);
      color: var(--frame-text);
      border-bottom: 1px solid var(--border-soft);
      user-select: none;
    }
    .menu-bar {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
    }
    .frame-fold,
    .menu-item,
    .win-btn {
      border: 0;
      background: transparent;
      color: var(--frame-text);
    }
    .frame-fold {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 28px;
      border-radius: 6px;
      flex: none;
    }
    .menu-item {
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.2;
      padding: 4px 8px;
      white-space: nowrap;
    }
    .menu-item[aria-current="page"],
    .menu-item[aria-expanded="true"],
    .frame-fold:hover,
    .menu-item:hover,
    .win-btn:hover {
      background: var(--frame-hover);
    }
    .app-menu { position: relative; }
    .app-menu-pop {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 80;
      display: grid;
      width: 280px;
      padding: 6px;
      border-radius: 12px;
      background: var(--menu);
      color: var(--menu-text);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16), 0 0 0 1px var(--menu-line);
    }
    .app-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      min-height: 32px;
      padding: 6px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--menu-text);
      font-size: 13px;
      line-height: 1.3;
      text-align: left;
    }
    .app-menu-item:hover { background: var(--menu-hover); }
    .app-menu-kbd,
    .app-menu-item .chevron { color: var(--menu-muted); flex: none; }
    .app-menu-rule {
      height: 1px;
      margin: 6px 8px;
      background: var(--menu-line);
    }
    .window-controls { display: flex; align-items: stretch; align-self: stretch; }
    .win-btn {
      width: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .win-btn.is-close:hover { background: #e81123; color: #ffffff; }
    .app {
      display: grid;
      grid-template-columns: 256px minmax(0, 1fr);
      min-height: 0;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--sidebar);
      color: var(--label);
      border-right: 1px solid var(--border-soft);
      padding: 8px;
      gap: 8px;
    }
    .brand-btn, .new-session, .side-row, .nav-row, .icon-btn, .text-btn, .send, .choice, .switch {
      border: 0;
      background: transparent;
    }
    .brand-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      text-align: left;
    }
    .brand-mark { width: 22px; height: auto; display: block; }
    .brand-copy { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .brand-name {
      font-family: var(--brand);
      font-weight: 500;
      font-size: 16px;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .brand-harness {
      font-family: var(--brand);
      font-weight: 500;
      font-size: 9px;
      letter-spacing: 0.14em;
      line-height: 1.2;
      color: var(--caption);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 4px;
    }
    .new-session {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 36px;
      margin: 0 4px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background: var(--selector);
      color: var(--label);
      border: 1px solid var(--border);
    }
    .kbd {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.4;
      color: var(--caption);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 4px;
    }
    .side-scroll { flex: 1 1 auto; }
    .ws { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; }
    .ws-label {
      margin: 0;
      padding: 4px 12px;
      color: var(--caption);
      font-size: 12px;
      line-height: 1.4;
    }
    .side-row, .nav-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 32px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      color: var(--secondary);
      text-align: left;
    }
    .side-row.is-workspace { color: var(--label); font-weight: 600; }
    .side-time {
      flex: none;
      color: var(--caption);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
    }
    .side-row[aria-current="true"], .nav-row[aria-current="page"] {
      background: var(--active);
      color: var(--label);
    }
    .side-foot {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-top: 8px;
      border-top: 1px solid var(--border-soft);
    }
    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      background: var(--bg);
    }
    .main.has-inspector { grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); }
    .user-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      padding: 6px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--border-soft);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 auto;
      min-width: 0;
      padding: 4px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--label);
      text-align: left;
    }
    .user-avatar {
      display: grid;
      place-items: center;
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1f8f4e;
      color: #ffffff;
    }
    .user-avatar svg { width: 16px; height: 16px; }
    .user-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }
    .user-side { display: flex; align-items: center; flex: none; }
    .main.is-home .topbar,
    .main.is-plain .topbar { display: none; }
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-soft);
    }
    .topbar-title { display: grid; gap: 0; }
    .kicker, .hero-badge, .caption, .choice-body, .field-help, .status {
      margin: 0;
      color: var(--caption);
      font-size: 13px;
      line-height: 1.45;
    }
    .kicker { font-size: 12px; }
    #view-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
    }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .text-btn, .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      color: var(--secondary);
      background: transparent;
    }
    .icon-btn { min-width: 36px; padding: 6px; }
    .icon-btn[aria-pressed="true"] { background: var(--active); color: var(--label); }
    .topbar-toggle { display: none; }
    .stage { min-width: 0; min-height: 0; display: grid; }
    #view-conversation, #view-messages {
      min-width: 0;
      min-height: 0;
    }
    #view-messages { height: 100%; }
    .messages {
      height: 100%;
      padding: 8px 32px 40px;
    }
    .messages-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
    }
    .messages-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .notice-day {
      margin: 18px 0 4px;
      color: var(--caption);
      font-size: 13px;
    }
    .notice {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 14px 0;
    }
    .notice-copy { display: grid; gap: 4px; min-width: 0; }
    .notice-title { font-size: 15px; font-weight: 600; line-height: 1.4; }
    .notice-body { margin: 0; color: var(--secondary); font-size: 14px; line-height: 1.5; }
    .notice .secondary { align-self: center; }
    #view-conversation { display: grid; grid-template-rows: minmax(0, 1fr); }
    #view-conversation.is-chat { grid-template-rows: minmax(0, 1fr) auto; }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      min-height: 0;
      padding: 32px 16px 40px;
    }
    .hero-copy { display: flex; justify-content: center; width: min(760px, 100%); }
    .hero-title {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }
    .hero-mark { width: 28px; height: 28px; display: block; flex: none; }
    .hero-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--secondary);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }
    .home-suggest {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: min(760px, 100%);
    }
    .home-suggest button {
      min-height: 32px;
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--secondary);
      font-size: 13px;
    }
    .transcript { padding: 8px 16px 0; }
    .thread {
      width: min(760px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px 0 12px;
    }
    .bubble {
      align-self: flex-end;
      max-width: min(560px, 88%);
      margin: 0;
      padding: 10px 14px;
      border-radius: var(--radius-lg);
      background: var(--card);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .assistant {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .disclosure {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-soft);
      background: transparent;
      text-align: left;
      color: var(--secondary);
    }
    .disclosure-body {
      margin: 0;
      padding: 0 12px 8px 34px;
      color: var(--secondary);
    }
    .disclosure-body p { margin: 0 0 4px; }
    .msg-actions { display: flex; gap: 4px; }
    .note { margin: 0; color: var(--caption); }
    .note--demo { font-size: 12px; line-height: 1.6; }

    /* ---- 运行过程 ----------------------------------------------------------
       对齐 dsh-client-ui-chat 与 dsh-client-ui-tool 的结构：
       TurnProcessNodeView（已完成的耗时收起条）→ ChatGroupSeat（过程分组，
       收起时是「修改了文件，已读取文件，已搜索代码等」）→ ToolRow（一行一次
       工具调用，可展开查看结果卡片）。 */
    .turn-process { display: flex; flex-direction: column; min-width: 0; }
    .turn-process-head {
      display: flex;
      align-items: center;
      width: 100%;
      min-width: 0;
      /* 33px 高度 + 8px 下内边距，底部一条发丝线：TurnProcessNodeView.module.css .root。 */
      height: 33px;
      padding: 0 0 8px;
      border: 0;
      border-bottom: 0.5px solid var(--border-soft);
      background: none;
      color: var(--caption);
      font: inherit;
      font-size: 14px;
      line-height: 24px;
      text-align: left;
      cursor: pointer;
      transition: color 100ms ease;
    }
    .turn-process-head:hover { color: var(--secondary); }
    .turn-process-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .turn-process-num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .turn-process-chevron { --od-icon-size: 14px; flex: none; margin-left: 4px; transition: transform 100ms ease; }

    /* 展开后的步骤列表：最多 400px 或视口一半，内部滚动，两端渐隐（ChatGroupSeat.module.css .body）。 */

    /* 展开的结果卡片：diff / 读取窗口 / 文件列表 / 命令输出，统一走代码字体卡片。 */
    .tool-card {

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function toast(text) {
      const node = $('toast');
      node.textContent = text;
      node.hidden = false;
      window.clearTimeout(toast._t);
      toast._t = window.setTimeout(() => { node.hidden = true; }, 2200);
    }

    function currentWorkspace() {
      return state.workspaces.find((ws) => ws.id === state.activeWorkspace) || state.workspaces[0];

    function currentSession() {
      for (const ws of state.workspaces) {
        const session = ws.sessions.find((item) => item.id === state.activeSession);
        if (session) return { ws, session };
      }
      return { ws: currentWorkspace(), session: null };
    }

    function accessLabel() { return state.access === 'full' ? 'Full access' : '只读'; }

    function deriveUsage(session) {
      if (!session) return null;
      const users = session.messages.filter((m) => m.role === 'user');
      const replies = session.messages.filter((m) => m.role === 'assistant');
      const input = users.reduce((sum, m) => sum + m.text.length, 0);
      const output = replies.reduce((sum, m) => sum + m.text.length, 0);
      if (input + output === 0) return null;
      return { input, output, turns: users.length, steps: replies.length };
    }

    function later(fn, ms) {
      const id = window.setTimeout(fn, ms);
      state.timers.push(id);

    /* ---- 运行过程 ----------------------------------------------------------
       结构对照 dsh-client-ui-chat 与 dsh-client-ui-tool：
       - TurnProcessNodeView：本轮结束后出现的「已完成，用时 …」，负责整轮过程的显示与收起。
       - ChatGroupSeat：一次连续工作的过程分组，收起时显示前三个类别的摘要
         （processTitle，对应 step-process.ts），展开后是逐次工具调用。
       - ToolRow：一行一次调用，标题 + 摘要 + 可选的大小与 diff 统计，展开看结果卡片。
       下面的行数据只是演示，字段沿用 tool / activity / state / counts 的叫法。 */

    const RUN_ACTIVITY = {
      think: 'thinking',
      read: 'read', read_image: 'readImage', grep: 'search', glob: 'search', search: 'search',
      write: 'write', edit: 'edit', apply_patch: 'edit',
      bash: 'commands', pwsh: 'commands', terminal: 'commands', commands: 'commands', run_code: 'code',
      web_search: 'webSearch', web_fetch: 'webFetch',
      subagent: 'subagents', todo_write: 'plan', ask_user_question: 'questions'
    };

    // message.stepProcess.done.* / message.stepProcess.*（dsh-client-ui-chat 的中文文案）。
    const PROCESS_DONE = {
      read: '已读取文件', readImage: '已读取图片', write: '已写入文件', search: '已搜索代码',
      edit: '修改了文件', commands: '执行了命令', code: '运行了代码',
      webSearch: '已搜索网页', webFetch: '已访问网页', subagents: '已协调子智能体',
      plan: '更新了计划', questions: '向用户提出了问题', tools: '已调用工具', context: '已注入上下文'
    };
    const PROCESS_LIVE = {
      thinking: '正在分析请求', read: '正在读取文件', readImage: '正在读取图片', write: '正在写入文件',
      search: '正在搜索代码', edit: '正在编辑文件', commands: '正在运行命令', code: '正在运行代码',
      webSearch: '正在搜索网页', webFetch: '正在访问网页', subagents: '正在协调子智能体',
      plan: '正在更新计划', questions: '等待你的操作', tools: '正在调用工具'
    };
    const TOOL_TITLES = {
      read: '读取', read_image: '读取图片', glob: '查找文件', grep: '搜索文件内容',
      edit: '编辑', apply_patch: '编辑', write: '写入',
      bash: '运行命令', pwsh: '运行命令', commands: '运行命令', run_code: '代码'
    };
    const PROCESS_ICONS = {
      read: ICONS.browse, readImage: ICONS.browse, search: ICONS.search, edit: ICONS.pen,
      write: ICONS.pen, commands: ICONS.terminal, code: ICONS.terminal,
      plan: ICONS.think, tools: ICONS.think, thinking: ICONS.think, questions: ICONS.think
    };

    function activityOf(row) {
      return row.activity || RUN_ACTIVITY[row.tool] || 'tools';
    }

    // processActivity()：按调用次数排序，同样次数按首次出现顺序。
    function processCounts(rows) {
      const counts = new Map();
      rows.forEach((row) => {
        if (row.tool === 'think') return; // 思考不是工具调用，不进入摘要。
        const kind = activityOf(row);
        counts.set(kind, (counts.get(kind) || 0) + 1);
      });
      return [...counts].map(([kind, count]) => ({ kind, count })).sort((left, right) => right.count - left.count);
    }

    // processTitle()：只取前三个类别，第四个及以后折叠成「等」。
    function processTitle(rows) {
      const counts = processCounts(rows);
      const labels = counts.slice(0, 3).map((item) => PROCESS_DONE[item.kind] || PROCESS_DONE.tools);
      const first = labels[0];
      if (!first) return '已完成分析';
      if (labels.length === 1) return first;
      const prefix = '已';
      if (labels.length === 2) {
        const second = labels[1];
        const shared = first.startsWith(prefix) && second.startsWith(prefix);
        return first + '并' + (shared ? second.slice(prefix.length) : second);
      }
      return labels.slice(0, 3).join('，') + (counts.length > 3 ? '等' : '');
    }

    function runElapsed(run) {
      return Math.max(0, (run.endedAt || Date.now()) - run.startedAt);
    }

    // formatRunDuration()：满 60 秒才出现「分」，满 60 分钟才出现「小时」。
    function durationHtml(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor(total / 60) % 60;
      const seconds = total % 60;
      const parts = [];
      if (hours > 0) parts.push('<span class="turn-process-num">' + hours + '</span> 小时');
      if (total >= 60) parts.push('<span class="turn-process-num">' + minutes + '</span> 分');
      parts.push('<span class="turn-process-num">' + seconds + '</span> 秒');
      return parts.join(' ');
    }

    function turnProcessLabel(run) {
      // 停止的轮次不显示耗时，和 TurnProcessNodeView 一致。
      if (run.status === 'stopped') return '已停止';
      return '已完成，用时 ' + durationHtml(runElapsed(run));
    }

    function inlineMd(text) {
      return esc(text)
        .replace(/`([^`\n]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    }

    // 最终回复只用到原型里需要的 Markdown 子集：段落、有序/无序列表、行内代码、加粗。
    function markdownHtml(source) {
      const lines = String(source).replace(/\r\n?/g, '\n').split('\n');
      const blocks = [];
      let paragraph = [];
      let list = null;
      const flushParagraph = () => {
        if (!paragraph.length) return;
        blocks.push('<p>' + inlineMd(paragraph.join(' ')) + '</p>');
        paragraph = [];
      };
      const flushList = () => {
        if (!list) return;
        blocks.push(renderMdList(list.items, list.ordered));
        list = null;
      };
      lines.forEach((line) => {
        if (!line.trim()) {
          flushParagraph();
          flushList();
          return;
        }
        const item = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line);
        if (item) {
          flushParagraph();
          const ordered = /\d/.test(item[2]);
          if (list && list.ordered !== ordered) flushList();
          if (!list) list = { ordered: ordered, items: [] };
          list.items.push({ level: Math.floor(item[1].replace(/\t/g, '  ').length / 2), text: item[3] });
          return;
        }
        flushList();
        paragraph.push(line.trim());
      });
      flushParagraph();
      flushList();
      return blocks.join('');
    }

    function renderMdList(items, ordered) {
      const root = { level: -1, children: [] };
      const stack = [root];
      items.forEach((item) => {
        while (stack.length > 1 && stack[stack.length - 1].level >= item.level) stack.pop();
        const node = { level: item.level, text: item.text, children: [] };
        stack[stack.length - 1].children.push(node);
        stack.push(node);
      });
      const tag = ordered ? 'ol' : 'ul';
      const render = (nodes) => '<' + tag + '>' + nodes.map((node) => '<li>' + inlineMd(node.text) + (node.children.length ? render(node.children) : '') + '</li>').join('') + '</' + tag + '>';
      return render(root.children);
    }

    function toolDetailHtml(row) {
      const detail = row.detail;
      if (!detail) return '';
      if (detail.type === 'text') {
        return '<p class="tool-think">' + esc(detail.text) + '</p>';
      }
      if (detail.type === 'paths') {
        const head = detail.title
          ? '<div class="tool-card-head"><span class="od-fill">' + esc(detail.title) + '</span></div>'
          : '';
        return '<div class="tool-card">' + head + '<div class="tool-card-body"><div class="tool-paths">' +
          detail.items.map((item) => '<span>' + esc(item) + '</span>').join('') + '</div></div></div>';
      }
      if (detail.type === 'diff') {
        const head = '<div class="tool-card-head"><span class="od-fill">' + esc(detail.title) + '</span><span>' +
          detail.added + ' 增 / ' + detail.removed + ' 删</span></div>';
        const lines = detail.lines.map((line) => {
          const kind = line[0];
          const sign = kind === 'add' ? '+' : kind === 'del' ? '-' : ' ';
          return '<div class="diff-line" data-kind="' + kind + '"><span class="sign">' + sign + '</span><span>' + esc(line[1]) + '</span></div>';
        }).join('');
        return '<div class="tool-card">' + head + '<div class="tool-card-body">' + lines + '</div></div>';
      }
      if (detail.type === 'read') {
        const from = detail.from || 1;
        const head = '<div class="tool-card-head"><span class="od-fill">' + esc(detail.title) + '</span><span>' +
          from + '–' + (from + detail.lines.length - 1) + '</span></div>';
        const lines = detail.lines.map((text, index) => '<div class="read-line"><span class="ln">' + (from + index) + '</span><span class="code">' + esc(text) + '</span></div>').join('');
        return '<div class="tool-card">' + head + '<div class="tool-card-body">' + lines + '</div></div>';
      }
      if (detail.type === 'output') {
        const head = '<div class="tool-card-head"><span class="od-fill">' + esc(detail.title) + '</span><span>退出码 0</span></div>';
        return '<div class="tool-card">' + head + '<div class="tool-card-body tool-output">' + esc(detail.text) + '</div></div>';
      }
      return '';
    }

    function toolRowHtml(run, row, index) {
      const activity = activityOf(row);
      const live = row.state === 'running';
      const title = row.tool === 'think' ? '思考' : (TOOL_TITLES[row.tool] || '工具调用');
      const open = row.open === true;
      const summary = row.summary
        ? '<span class="tool-sep" aria-hidden="true"></span><span class="tool-summary' + (row.path ? ' is-path' : '') + (live ? ' is-shimmer' : '') + '">' + esc(row.summary) + '</span>'
        : '';
      const suffix = row.suffix ? '<span class="tool-suffix">' + esc(row.suffix) + '</span>' : '';
      const diff = typeof row.added === 'number'
        ? '<span class="tool-diff"><span class="diff-add">+' + row.added + '</span> <span class="diff-del">-' + row.removed + '</span></span>'
        : '';
      const body = open ? '<div class="tool-row-body">' + toolDetailHtml(row) + '</div>' : '';
      return '<div class="tool-row tool-row--' + esc(row.tool) + '" data-tool="' + esc(row.tool) + '" data-state="' +
        (live ? 'running' : 'ok') + '"' + (open ? ' data-open' : '') + '>' +
          '<button type="button" class="tool-row-head" data-action="toggle-run-row" data-id="' + esc(run.id) +
            '" data-index="' + index + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
            '<span class="tool-leading" aria-hidden="true">' + (PROCESS_ICONS[activity] || ICONS.think) + '</span>' +
            '<span class="tool-title' + (live ? ' is-shimmer' : '') + '">' + esc(title) + '</span>' +
            summary + suffix + diff +
            '<span class="tool-chevron" aria-hidden="true">' + ICONS.chevronRight + '</span>' +
          '</button>' + body +
        '</div>';
    }

    function runHtml(run) {
      const running = run.status === 'running';
      // 默认折叠：运行中的过程分组和已完成的整轮过程都先收起，点开再看细节。
      const turnOpen = running || run.open === true;
      const groupOpen = run.groupOpen === true;
      const counts = processCounts(run.rows);
      const liveRow = run.rows.find((row) => row.state === 'running');
      const activity = liveRow ? activityOf(liveRow) : (counts[0] ? counts[0].kind : 'thinking');
      const label = running
        ? (liveRow ? (PROCESS_LIVE[activity] || PROCESS_LIVE.tools) : PROCESS_LIVE.thinking)
        : processTitle(run.rows);
      const groupId = esc(run.id) + '-process';
      const turnId = esc(run.id) + '-turn';
      const head = running
        ? ''
        : '<button type="button" class="turn-process-head" data-action="toggle-turn" data-id="' + esc(run.id) +
          '" aria-expanded="' + (turnOpen ? 'true' : 'false') + '" aria-controls="' + turnId + '">' +
            '<span class="turn-process-label">' + turnProcessLabel(run) + '</span>' +
            '<span class="turn-process-chevron" aria-hidden="true">' + ICONS.chevronDown + '</span>' +
          '</button>';
      const group =
        '<div class="step-process" data-process-activity="' + esc(activity) + '">' +
          '<button type="button" class="step-process-head" data-action="toggle-process" data-id="' + esc(run.id) +
            '" aria-expanded="' + (groupOpen ? 'true' : 'false') + '" aria-controls="' + groupId + '">' +
            '<span class="step-leading" aria-hidden="true">' +
              '<span class="step-icon">' + (PROCESS_ICONS[activity] || ICONS.think) + '</span>' +
              '<span class="step-chevron">' + (groupOpen ? ICONS.chevronUp : ICONS.chevronDown) + '</span>' +
            '</span>' +
            '<span class="step-label' + (running ? ' is-shimmer' : '') + '">' + esc(label) + '</span>' +
          '</button>' +
          '<div class="step-process-body" id="' + groupId + '"' + (groupOpen ? '' : ' hidden') + '>' +
            '<div class="step-process-content">' + run.rows.map((row, index) => toolRowHtml(run, row, index)).join('') + '</div>' +
          '</div>' +
        '</div>';
      return '<div class="turn-process" data-status="' + esc(run.status) + '">' + head +
        '<div class="turn-process-body" id="' + turnId + '"' + (turnOpen ? '' : ' hidden') + '>' + group + '</div>' +
      '</div>';
    }

    function startRun(session, text) {
      const run = {
        id: uid(), role: 'run', status: 'running',
        startedAt: Date.now(), endedAt: null,
        open: false, groupOpen: false, rows: []
      };
      session.messages.push(run);
      let at = 0;
      demoRunPlan().forEach((step) => {
        at += step.delay;
        later(() => {
          if (run.status !== 'running') return;
          run.rows.forEach((row) => { if (row.state === 'running') row.state = 'ok'; });
          const row = Object.assign({ id: uid() }, step, { state: 'running', open: false });
          delete row.delay;
          run.rows.push(row);
          renderAll({ scroll: 'end' });
        }, at);
      });
      at += 700;
      later(() => {
        if (run.status !== 'running') return;
        run.rows.forEach((row) => { row.state = 'ok'; });
        run.endedAt = Date.now();
        run.status = 'done';
        // 整轮过程默认收起；展开这一轮后直接看到完整的步骤列表。
        run.open = false;
        run.groupOpen = true;
        state.sending = false;
        session.messages.push({ id: uid(), role: 'assistant', md: true, text: demoFinalText() });
        session.messages.push({ id: uid(), role: 'note', demo: true, text: '原型演示：步骤与耗时由本地脚本生成，没有连接模型。触发消息：' + demoAsk(text) + '。' });
        renderAll({ scroll: 'end' });
        // 收尾后列表回到第一条，和参考图一样从最早的工具调用往下看。
        const body = transcript.querySelector('#' + CSS.escape(run.id + '-process'));
        if (body) {
          body.scrollTop = 0;
          syncStepProcessBody(body);
        }
        say('已完成本轮演示');
        composerInput.focus();
      }, at);
      renderAll({ scroll: 'end' });
    }

    function messageHtml(message) {
      if (message.role === 'user') {
        return '<p class="bubble">' + esc(message.text) + '</p>';
      }
      if (message.role === 'run') return runHtml(message);
      if (message.role === 'context') {
        const summary = message.items.map((item) => item.state + ' ' + item.name).join('、');
        const body = message.open
          ? '<div class="disclosure-body">' + message.items.map((item) => '<p>' + esc(item.state) + ' ' + esc(item.name) + '</p>').join('') + (message.note ? '<p class="caption">' + esc(message.note) + '</p>' : '') + '</div>'
          : '';
        return '<div><button type="button" class="disclosure" data-action="toggle-context" data-id="' + esc(message.id) + '" aria-expanded="' + (message.open ? 'true' : 'false') + '">' + ICONS.chevron + '<span class="od-field od-fill"><span>上下文注入</span><span class="caption od-clamp-2">' + esc(summary) + '</span></span></button>' + body + '</div>';
      }
      if (message.role === 'think') {
        const body = message.open ? '<div class="disclosure-body"><p>' + esc(message.text) + '</p></div>' : '';
        return '<div><button type="button" class="disclosure" data-action="toggle-think" data-id="' + esc(message.id) + '" aria-expanded="' + (message.open ? 'true' : 'false') + '">' + ICONS.chevron + '<span class="od-field od-fill"><span>思考</span><span class="caption">已思考</span></span></button>' + body + '</div>';
      }
      if (message.role === 'assistant') {
        const vote = state.feedback[message.id] || '';
        const body = message.md
          ? '<div class="assistant-md">' + markdownHtml(message.text) + '</div>'
          : '<p class="assistant">' + esc(message.text) + '</p>';
        return '<div class="od-stack">' + body + '<div class="msg-actions"><button type="button" class="icon-btn" data-action="copy" data-id="' + esc(message.id) + '" aria-label="复制">' + ICONS.copy + '</button><button type="button" class="icon-btn" data-action="feedback" data-vote="up" data-id="' + esc(message.id) + '" aria-pressed="' + (vote === 'up' ? 'true' : 'false') + '" aria-label="有帮助">' + ICONS.up + '</button><button type="button" class="icon-btn" data-action="feedback" data-vote="down" data-id="' + esc(message.id) + '" aria-pressed="' + (vote === 'down' ? 'true' : 'false') + '" aria-label="没帮助">' + ICONS.down + '</button></div></div>';
      }
      return '<p class="note' + (message.demo ? ' note--demo' : '') + '">' + esc(message.text) + '</p>';
    }

    // 过程列表自己滚动：两端渐隐属性跟着滚动位置走（ChatGroupSeat 的 fadeTop / fadeBottom）。
    function syncStepProcessBody(body) {
      if (!body || body.hidden) return;
      const scrollable = body.scrollHeight - body.clientHeight > 1;
      const atTop = body.scrollTop <= 1;
      const atBottom = body.scrollHeight - body.clientHeight - body.scrollTop <= 1;
      body.toggleAttribute('data-scroll-up', scrollable && !atTop);
      body.toggleAttribute('data-scroll-down', scrollable && !atBottom);
    }

    function syncStepProcessEdges() {
      transcript.querySelectorAll('.step-process-body').forEach(syncStepProcessBody);
    }

    function renderTranscript(opts) {
      const session = currentSession().session;
      const prev = document.activeElement;
      const restore = prev && prev.dataset && prev.closest('#transcript')
        ? { action: prev.dataset.action, id: prev.dataset.id, vote: prev.dataset.vote || '', index: prev.dataset.index || '' }
        : null;
      const top = transcript.scrollTop;
      transcript.innerHTML = session
        ? '<div class="thread">' + session.messages.map(messageHtml).join('') + '</div>'
        : '';
      if (opts && opts.scroll === 'end') {
        transcript.scrollTop = transcript.scrollHeight;
        transcript.querySelectorAll('.step-process-body').forEach((body) => { body.scrollTop = body.scrollHeight; });
      } else {
        transcript.scrollTop = top;
      }
      syncStepProcessEdges();
      if (restore && restore.id) {
        const voteSel = restore.vote ? '[data-vote="' + CSS.escape(restore.vote) + '"]' : '';
        const indexSel = restore.index !== '' ? '[data-index="' + CSS.escape(restore.index) + '"]' : '';
        const btn = transcript.querySelector('[data-action="' + CSS.escape(restore.action) + '"][data-id="' + CSS.escape(restore.id) + '"]' + indexSel + voteSel);
        if (btn) btn.focus();
      }
    }

      panel.hidden = false;
      main.classList.add('has-inspector');
      const title = state.inspector === 'log' ? 'Session log' : '轨迹';
      $('inspector-title').textContent = title;
      const session = currentSession().session;
      const body = $('inspector-body');
      if (!session || session.messages.length === 0) {
        body.innerHTML = '<p class="empty">这个会话还没有记录。先发送一条消息。</p>';
        return;
      }
      if (state.inspector === 'log') {
        body.innerHTML = '<table class="log-table"><thead><tr><th>序号</th><th>类型</th><th>摘要</th></tr></thead><tbody>' + session.messages.map((message, index) => '<tr><td class="od-nowrap">' + (index + 1) + '</td><td class="od-nowrap">' + esc(roleLabel(message.role)) + '</td><td>' + esc(messageSummary(message)) + '</td></tr>').join('') + '</tbody></table>';
        return;

      body.innerHTML = '<ol class="timeline">' + session.messages.map((message, index) => '<li><span class="caption od-nowrap">' + (index + 1) + ' · ' + esc(roleLabel(message.role)) + '</span><span>' + esc(messageSummary(message)) + '</span></li>').join('') + '</ol>';
