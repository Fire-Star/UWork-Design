    function syncUsage() {
      const session = currentSession().session;
      const usage = deriveUsage(session);
      const stats = $('stats');
      const heroMode = state.view !== 'conversation' || !session || session.messages.length === 0;
      if (heroMode || !usage || !stats) {
        if (stats) { stats.hidden = true; stats.innerHTML = ''; }
        return;
      }
      const tokens = (2.4 + (usage.steps % 4) * 0.1).toFixed(1);
      const speed = 196 + (usage.steps * 7) % 32;
      const hit = 96 + usage.turns % 3;
      const context = 9 + usage.turns % 12;
      stats.hidden = false;
      stats.innerHTML = '<span class="stat-pill"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-clock"/></svg>' + usage.turns + ' 轮 ' + usage.steps + ' 步 · ' + speed + ' tok/s</span>'
        + '<span class="stat-pill"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-database"/></svg>' + tokens + 'M tok · 缓存命中 ' + hit + '%</span>'
        + '<span class="stat-pill"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-gauge"/></svg>' + context + '%</span>';
    }

    function syncComposerWorkspace() {
      const menu = $('composer-workspace-menu');
      const trigger = $('composer-workspace');
      if (!menu || !trigger) return;
      const ids = state.workspaces.map((ws) => ws.id).join('\n');
      if (menu.dataset.ids !== ids) {
        menu.dataset.ids = ids;
        menu.innerHTML = state.workspaces.map((ws) => {
          const on = ws.id === state.activeWorkspace;
          return '<button type="button" class="picker-option" role="option" data-value="' + esc(ws.id) + '" aria-selected="' + (on ? 'true' : 'false') + '">'
            + '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-folder-' + (on ? 'open' : 'close') + '"/></svg>'
            + '<span class="picker-label">' + esc(ws.name) + '</span>' + CHECK_ICON + '</button>';
        }).join('');
      } else {
        menu.querySelectorAll('[role="option"]').forEach((item) => {
          const on = item.dataset.value === state.activeWorkspace;
          item.setAttribute('aria-selected', on ? 'true' : 'false');
          const use = item.querySelector('use');
          if (use) use.setAttribute('href', on ? '#i-folder-open' : '#i-folder-close');
        });
      }
      const current = state.workspaces.find((ws) => ws.id === state.activeWorkspace);
      trigger.querySelector('.picker-value').textContent = current ? current.name : '';
      const use = trigger.querySelector('.chip-icon use');
      if (use) use.setAttribute('href', '#i-folder-open');
    }

    function syncSend() {
      const idle = !state.sending && !composerInput.value.trim();
      sendBtn.classList.toggle('is-idle', idle);
      sendBtn.innerHTML = state.sending
        ? '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-stop"/></svg>'
        : '<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-send"/></svg>';
      sendBtn.setAttribute('aria-label', state.sending ? '停止生成' : '发送消息');
      composerInput.disabled = state.sending;
    }

    function syncBrowser() {
      const allowed = state.mode === 'compatibility';
      const browserSwitch = $('browser-switch');
      const lanSwitch = $('lan-switch');
      browserSwitch.disabled = !allowed;
      if (!allowed && state.openBrowser) state.openBrowser = false;
      if (!state.openBrowser && state.lan) state.lan = false;
      setSwitch(browserSwitch, state.openBrowser);
      lanSwitch.disabled = !state.openBrowser;
      setSwitch(lanSwitch, state.lan);
      $('browser-notice').hidden = allowed;
      $('url-block').hidden = !state.openBrowser;
      $('browser-url').textContent = 'http://127.0.0.1:' + state.port + '/';
      $('lan-note').hidden = !state.lan;
    }

    function syncNotify() {
      document.querySelectorAll('[data-notify]').forEach((button) => {
        const key = button.dataset.notify;
        setSwitch(button, !!state.notify[key]);
        if (key !== 'enabled') button.disabled = !state.notify.enabled;
      });
    }

    function syncModes() {
      document.querySelectorAll('input[name="window-mode"]').forEach((input) => {
        const on = input.value === state.mode;
        input.checked = on;
        const choice = input.closest('.choice');
        choice.classList.toggle('is-selected', on);
        choice.querySelector('.choice-status').textContent = on ? '已选择' : '';
      });
    }

    function applyTheme(theme) {
      state.theme = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = state.theme;
      document.querySelectorAll('input[name="color-theme"]').forEach((input) => {
        const on = input.value === state.theme;
        input.checked = on;
        const choice = input.closest('.choice');
        if (!choice) return;
        choice.classList.toggle('is-selected', on);
        const status = choice.querySelector('.choice-status');
        if (status) status.textContent = on ? '已选择' : '';
      });
    }

    function syncSettingsTabs() {
      document.querySelectorAll('[data-settings-panel]').forEach((panel) => {
        panel.hidden = panel.dataset.settingsPanel !== state.settingsTab;
      });
      document.querySelectorAll('.set-nav[data-action="settings-tab"]').forEach((tab) => {
        tab.setAttribute('aria-selected', tab.dataset.tab === state.settingsTab ? 'true' : 'false');
      });
    }

    function syncPersona() {
      const callBtn = $('call-name-btn');
      const nameBtn = $('assistant-name-btn');
      callBtn.textContent = state.callName || '暂无内容，点击编辑添加';
      callBtn.classList.toggle('is-filled', !!state.callName);
      nameBtn.textContent = state.assistantName || '暂无内容，点击编辑添加';
      nameBtn.classList.toggle('is-filled', !!state.assistantName);
      callBtn.hidden = state.editing === 'callName';
      $('call-name-editor').hidden = state.editing !== 'callName';
      nameBtn.hidden = state.editing === 'assistantName';
      $('assistant-name-editor').hidden = state.editing !== 'assistantName';

      const instructionView = $('instruction-view');
      instructionView.textContent = state.instruction || '例如：回答尽量简洁，先给结论';
      instructionView.classList.toggle('is-filled', !!state.instruction);
      instructionView.hidden = state.editing === 'instruction';
      $('instruction-editor').hidden = state.editing !== 'instruction';
      $('instruction-edit').textContent = state.editing === 'instruction' ? '完成' : '编辑';

      const personaView = $('persona-view');
      personaView.textContent = state.personaText;
      personaView.hidden = state.editing === 'personaText' || !state.personaText;
      $('persona-editor').hidden = state.editing !== 'personaText';
      $('persona-edit').textContent = state.editing === 'personaText' ? '完成' : '编辑';

      setSwitch($('home-suggest'), state.homeSuggest);
      const styleLabels = { default: '默认', brief: '简洁', detailed: '详细', warm: '亲切' };
      $('reply-style').querySelector('.picker-value').textContent = styleLabels[state.replyStyle] || '默认';
      $('reply-style-menu').querySelectorAll('[role="option"]').forEach((item) => {
        item.setAttribute('aria-selected', item.dataset.value === state.replyStyle ? 'true' : 'false');
      });
      const suggest = $('home-suggest-row');
      if (suggest) {
        const session = currentSession().session;
        const heroMode = state.view === 'conversation' && (!session || session.messages.length === 0);
        suggest.hidden = !heroMode || !state.homeSuggest;
      }
    }

    function beginFieldEdit(field) {
      state.editing = field;
      syncPersona();
      const input = $(field + '-input');
      if (!input) return;
      const values = {
        callName: state.callName,
        assistantName: state.assistantName,
        instruction: state.instruction,
        personaText: state.personaText
      };
      input.value = values[field] || '';
      input.focus();
    }

    function commitField(field) {
      const input = $(field + '-input');
      if (input) {
        const value = input.value.trim();
        if (field === 'callName') state.callName = value;
        if (field === 'assistantName') state.assistantName = value;
        if (field === 'instruction') state.instruction = value;
        if (field === 'personaText') state.personaText = value;
      }
      if (state.editing === field) state.editing = '';
      syncPersona();
    }

    function syncChrome() {
      const found = currentSession();
      const session = found.session;
      const heroMode = state.view === 'conversation' && (!session || session.messages.length === 0);
      placeComposer(heroMode);
      viewConversation.hidden = state.view !== 'conversation';
      viewMessages.hidden = state.view !== 'messages';
      viewConversation.classList.toggle('is-chat', !heroMode && state.view === 'conversation');
      hero.hidden = !heroMode;
      const suggest = $('home-suggest-row');
      if (suggest) suggest.hidden = !heroMode || !state.homeSuggest;
      transcript.hidden = heroMode || state.view !== 'conversation';
      dock.hidden = heroMode || state.view !== 'conversation';
      const sessionTools = $('session-tools');
      if (sessionTools) sessionTools.hidden = state.view !== 'conversation';
      $('view-title').textContent = session ? session.title : '新会话';
      const taskChip = $('task-chip');
      if (taskChip) taskChip.hidden = !state.sending;
      document.querySelectorAll('#session-tabs .tab').forEach((tab) => {
        const isMore = tab.classList.contains('tab-more');
        const active = state.inspector === null
          ? tab.dataset.action === 'tab-conversation'
          : isMore ? state.inspector === 'log' : tab.dataset.inspector === state.inspector;
        tab.classList.toggle('is-active', active);
      });
      const presetText = $('preset-label-text');
      if (presetText) presetText.textContent = state.preset;
      composer.classList.toggle('is-hero', heroMode);
      $('main').classList.toggle('is-home', heroMode);
      $('main').classList.toggle('is-plain', state.view === 'messages');
      syncComposerWorkspace();
      composerInput.placeholder = heroMode
        ? '描述你想要构建的内容, / 调用指令, @ 文件或对话'
        : '发消息或创建任务, / 调用指令, @ 文件或对话';
      const narrow = narrowQuery.matches;
      app.classList.toggle('is-rail', !narrow && state.rail);
      app.classList.toggle('is-drawer', narrow && state.drawer);
      $('scrim').hidden = !(narrow && state.drawer);
      const sideLabel = narrow
        ? (state.drawer ? '关闭侧边栏' : '打开侧边栏')
        : (state.rail ? '打开侧边栏' : '收起侧边栏');
      $('frame-toggle').setAttribute('aria-label', sideLabel);
      syncUsage();
      syncSend();
    }

    function renderAll(opts) {
      renderSidebar();
      renderTranscript(opts);
      renderPlugins();
      renderInspector();
      syncChrome();
    }

    function grow() {
      composerInput.style.height = 'auto';
      composerInput.style.height = Math.min(composerInput.scrollHeight, 240) + 'px';
    }

    function createSession() {
      const current = currentSession().session;
      state.view = 'conversation';
      state.inspector = null;
      if (narrowQuery.matches) state.drawer = false;
      if (current && current.messages.length === 0) {
        state.activeSession = current.id;
        renderAll();
        composerInput.focus();
        return;
      }
      const session = { id: uid(), title: '新会话', messages: [] };
      currentWorkspace().sessions.unshift(session);
      state.activeSession = session.id;
      renderAll();
      composerInput.focus();
    }

    function ensureSession() {
      const current = currentSession().session;
      if (current) return current;
      const session = { id: uid(), title: '新会话', messages: [] };
      currentWorkspace().sessions.unshift(session);
      state.activeSession = session.id;
      return session;
    }

    function send() {
      const text = composerInput.value.trim();
      if (!text || state.sending) return;
      const session = ensureSession();
      if (session.title === '新会话') {
        const line = text.split('\n')[0].trim();
        session.title = line.length > 24 ? line.slice(0, 24) + '…' : line;
      }
      session.messages.push({ id: uid(), role: 'user', text: text });
      composerInput.value = '';
      grow();
      state.sending = true;
      renderAll({ scroll: 'end' });
      startRun(session, text);
      say('智能体正在运行');
    }

    function stopTurn() {
      clearTimers();
      if (!state.sending) return;
      state.sending = false;
      let run = null;
      state.workspaces.forEach((ws) => {
        ws.sessions.forEach((session) => {
          session.messages.forEach((message) => {
            if (message.role === 'run' && message.status === 'running') run = message;
          });
        });
      });
      if (run) {
        run.status = 'stopped';
        run.endedAt = Date.now();
        run.rows.forEach((row) => { row.state = 'ok'; });
        // 停止的轮次同样先收起整轮，展开后能直接看到已经跑过的步骤。
        run.open = false;
        run.groupOpen = true;
      }
      renderAll({ scroll: 'end' });
      composerInput.focus();
    }

    function showDialog(dialog, opener) {
      state.opener = opener || document.activeElement;
      dialog.showModal();
      const auto = dialog.querySelector('[data-autofocus]');
      if (auto) auto.focus();
    }

    function setSettingsTab(tab) {
      if (state.editing) commitField(state.editing);
      const changed = state.settingsTab !== tab;
      state.settingsTab = tab;
      if (changed) state.pluginDetail = null;
      syncSettingsTabs();
      if (tab === 'plugins') renderPlugins();
      const body = document.querySelector('#settings .settings-body');
      if (body) body.scrollTop = 0;
      const current = document.querySelector('#settings .set-nav[data-tab="' + tab + '"]');
      if (current) current.focus({ preventScroll: true });
    }

    function openSettings(opener, tab) {
      if (tab) state.settingsTab = tab;
      syncModes();
      syncBrowser();
      syncNotify();
      syncSettingsTabs();
      syncPersona();
      renderPlugins();
      applyTheme(state.theme);
      $('settings-model').textContent = state.model;
      showDialog($('settings'), opener);
      const current = document.querySelector('#settings .set-nav[data-tab="' + state.settingsTab + '"]');
      if (current) current.focus();
      syncChrome();
    }

    function parsePort(value) {
      if (!/^\d+$/.test(value)) return null;
      const n = Number(value);
      if (n < 1 || n > 65535) return null;
      return n;
    }

    function closePickers() {
      document.querySelectorAll('.picker-menu').forEach((menu) => { menu.hidden = true; });
      document.querySelectorAll('.picker-trigger').forEach((trigger) => {
        trigger.setAttribute('aria-expanded', 'false');
      });
    }

    function closeAppMenu() {
      const menu = $('app-menu');
      if (!menu || menu.hidden) return;
      menu.hidden = true;
      $('menu-app').setAttribute('aria-expanded', 'false');
    }

    function closePluginAddMenu() {
      const menu = $('plugin-add-menu');
      if (!menu || menu.hidden) return;
      menu.hidden = true;
      $('plugin-add-toggle').setAttribute('aria-expanded', 'false');
    }

    function openPluginAddMenu() {
      const menu = $('plugin-add-menu');
      if (!menu) return;
      menu.hidden = false;
      $('plugin-add-toggle').setAttribute('aria-expanded', 'true');
      const first = menu.querySelector('[role="menuitem"]');
      if (first) first.focus();
    }

    function placeMenu(trigger, menu) {
      const rect = trigger.getBoundingClientRect();
      menu.style.minWidth = Math.max(rect.width, 180) + 'px';
      const menuRect = menu.getBoundingClientRect();
      const menuHeight = menuRect.height;
      const menuWidth = menuRect.width;
      const spaceBelow = window.innerHeight - rect.bottom;
      const openUp = rect.top > menuHeight + 16;
      let left = trigger.closest('.composer-end') ? rect.right - menuWidth : rect.left;
      left = Math.max(8, Math.min(left, window.innerWidth - menuWidth - 8));
      const top = openUp
        ? Math.max(8, rect.top - menuHeight - 6)
        : Math.min(window.innerHeight - menuHeight - 8, rect.bottom + 6);
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
    }

    function openPicker(trigger) {
      const menu = document.getElementById(trigger.getAttribute('aria-controls'));
      if (!menu) return;
      closePickers();
      menu.hidden = false;
      trigger.setAttribute('aria-expanded', 'true');
      placeMenu(trigger, menu);
      const selected = menu.querySelector('[aria-selected="true"]') || menu.querySelector('[role="option"]');
      if (selected) selected.focus();
    }

    function choosePicker(option) {
      const menu = option.closest('.picker-menu');
      const trigger = document.querySelector('[aria-controls="' + CSS.escape(menu.id) + '"]');
      if (!trigger) return;
      menu.querySelectorAll('[role="option"]').forEach((item) => {
        item.setAttribute('aria-selected', item === option ? 'true' : 'false');
      });
      const label = option.querySelector('.picker-label');
      trigger.querySelector('.picker-value').textContent = label ? label.textContent : '';
      closePickers();
      const value = option.dataset.value;
      if (trigger.id === 'access') {
        state.access = value;
        const icons = { full: '#i-perm-full', workspace: '#i-perm-workspace', read: '#i-perm-readonly', auto: '#i-perm-auto' };
        const accessIcon = $('access-icon');
        if (accessIcon) accessIcon.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><use href="' + (icons[value] || icons.full) + '"/></svg>';
        trigger.setAttribute('aria-label', '访问模式，当前：' + (label ? label.textContent : ''));
      }
      if (trigger.id === 'preset') {
        state.preset = value;
        const presetText = $('preset-label-text');
        if (presetText) presetText.textContent = value;
      }
      if (trigger.id === 'model') {
        state.model = value;
        $('settings-model').textContent = value;
      }
      if (trigger.id === 'reply-style') state.replyStyle = value;
      if (trigger.id === 'log-level') {
        $('log-status').textContent = '日志级别已记为 ' + value + '。只保存在这个页面里。';
      }
      if (trigger.id === 'composer-workspace') {
        state.activeWorkspace = value;
        state.activeSession = null;
        state.view = 'conversation';
        state.inspector = null;
        renderAll();
      }
      if (trigger.isConnected) trigger.focus();
    }

    document.addEventListener('click', (event) => {
      const option = event.target.closest('.picker-option');
      if (option) {
        choosePicker(option);
        return;
      }
      const trigger = event.target.closest('.picker-trigger');
      if (trigger) {
        if (trigger.getAttribute('aria-expanded') === 'true') closePickers();
        else openPicker(trigger);
        return;
      }
      closePickers();
      if (!event.target.closest('.app-menu')) closeAppMenu();
      if (!event.target.closest('.plugin-add')) closePluginAddMenu();
      const btn = event.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === 'skip') {
        if ($('view-title').offsetParent === null) composerInput.focus();
        else $('view-title').focus();
        return;
      }
      if (action === 'toggle-app-menu') {
        const menu = $('app-menu');
        const open = menu.hidden;
        menu.hidden = !open;
        $('menu-app').setAttribute('aria-expanded', open ? 'true' : 'false');
        return;
      }
      if (btn.closest('#app-menu')) closeAppMenu();
      if (action === 'app-note') {
        toast('这一项只在原型里展示');
        return;
      }
      if (action === 'reload-ui') {
        window.location.reload();
        return;
      }
      if (action === 'window-control') {
        toast('这个原型不能控制窗口');
        return;
      }
      if (action === 'toggle-sidebar') {
        if (narrowQuery.matches) state.drawer = !state.drawer;
        else state.rail = !state.rail;
        syncChrome();
        return;
      }
      if (action === 'close-drawer') {
        state.drawer = false;
        syncChrome();
        $('frame-toggle').focus();
        return;
      }
      if (action === 'new-session') {
        createSession();
        return;
      }
      if (action === 'open-workspace') {
        const id = btn.dataset.workspace;
        state.collapsed[id] = !state.collapsed[id];
        if (state.activeSession === null) state.activeWorkspace = id;
        state.view = 'conversation';
        state.inspector = null;
        if (narrowQuery.matches) state.drawer = false;
        renderAll();
        return;
      }
      if (action === 'open-session') {
        state.activeWorkspace = btn.dataset.workspace;
        state.activeSession = btn.dataset.session;
        state.view = 'conversation';
        state.inspector = null;
        if (narrowQuery.matches) state.drawer = false;
        renderAll({ scroll: 'end' });
        return;
      }
      if (action === 'open-messages') {
        state.view = 'messages';
        state.inspector = null;
        if (narrowQuery.matches) state.drawer = false;
        renderAll();
        return;
      }
      if (action === 'close-messages') {
        state.view = 'conversation';
        renderAll();
        return;
      }
      if (action === 'open-settings') {
        openSettings(btn, btn.dataset.tab);
        return;
      }
      if (action === 'close-settings') {
        if (!$('uninstall-layer').hidden) {
          $('uninstall-layer').hidden = true;
          state.pendingUninstall = null;
          const opener = document.querySelector('[data-action="ask-uninstall"]');
          if (opener) opener.focus();
          return;
        }
        if (!$('lan-layer').hidden) {
          $('lan-layer').hidden = true;
          return;
        }
        if (state.editing) commitField(state.editing);
        $('settings').close();
        return;
      }
      if (action === 'settings-edit') {
        const field = btn.dataset.field;
        if (state.editing === field) commitField(field);
        else {
          if (state.editing) commitField(state.editing);
          beginFieldEdit(field);
        }
        return;
      }
      if (action === 'toggle-home-suggest') {
        state.homeSuggest = !state.homeSuggest;
        syncPersona();
        return;
      }
      if (action === 'import-note') {
        toast('这个原型不能导入文件');
        return;
      }
      if (action === 'use-suggest') {
        composerInput.value = btn.dataset.suggest;
        grow();
        syncSend();
        composerInput.focus();
        return;
      }
      if (action === 'settings-tab') {
        setSettingsTab(btn.dataset.tab);
        return;
      }
      if (action === 'tab-conversation') {
        state.inspector = null;
        state.view = 'conversation';
        renderInspector();
        syncChrome();
        return;
      }
      if (action === 'open-inspector') {
        state.inspector = state.inspector === btn.dataset.inspector ? null : btn.dataset.inspector;
        state.view = 'conversation';
        renderInspector();
        syncChrome();
        if (state.inspector) $('inspector').querySelector('[data-action="close-inspector"]').focus();
        return;
      }
      if (action === 'close-inspector') {
        state.inspector = null;
        renderInspector();
        syncChrome();
        const tab = document.querySelector('[data-inspector="trajectory"]');
        if (tab) tab.focus();
        return;
      }
      if (action === 'toggle-context' || action === 'toggle-think') {
        const session = currentSession().session;
        const message = session && session.messages.find((item) => item.id === btn.dataset.id);
        if (message) message.open = !message.open;
        renderTranscript();
        return;
      }
      if (action === 'toggle-turn' || action === 'toggle-process' || action === 'toggle-run-row') {
        const session = currentSession().session;
        const run = session && session.messages.find((message) => message.role === 'run' && message.id === btn.dataset.id);
        if (!run) return;
        if (action === 'toggle-turn') run.open = run.open !== true;
        else if (action === 'toggle-process') run.groupOpen = run.groupOpen !== true;
        else {
          const row = run.rows[Number(btn.dataset.index)];
          if (row) row.open = !row.open;
        }
        renderTranscript();
        return;
      }
      if (action === 'copy') {
        const session = currentSession().session;
        const message = session && session.messages.find((item) => item.id === btn.dataset.id);
        if (!message) return;
        const text = message.text;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => toast('已复制')).catch(() => toast('没能写入剪贴板'));
        } else toast('没能写入剪贴板');
        return;
      }
      if (action === 'feedback') {
        const id = btn.dataset.id;
        state.feedback[id] = state.feedback[id] === btn.dataset.vote ? '' : btn.dataset.vote;
        renderTranscript();
        return;
      }
      if (action === 'attach') {
        const menu = $('command-menu');
        if (!menu) return;
        if (!menu.hidden) { closePickers(); return; }
        closePickers();
        menu.hidden = false;
        placeMenu(btn, menu);
        const height = menu.getBoundingClientRect().height;
        menu.style.top = Math.max(8, btn.getBoundingClientRect().top - height - 8) + 'px';
        return;
      }
      if (action === 'command-note') {
        closePickers();
        toast(btn.dataset.note || '这个原型不能打开系统选择器');
        return;
      }
      if (action === 'send-click') return;
      if (action === 'plugin-refresh') {
        renderPlugins();
        toast('插件列表已刷新');
        return;
      }
      if (action === 'plugin-info') {
        toast('在这里安装、启用和配置插件');
        return;
      }
      if (action === 'plugin-add') {
        toast('添加插件入口在真实客户端中打开');
        return;
      }
      if (action === 'toggle-add-menu') {
        if ($('plugin-add-menu').hidden) openPluginAddMenu();
        else {
          closePluginAddMenu();
          $('plugin-add-toggle').focus();
        }
        return;
      }
      if (action === 'plugin-add-note') {
        closePluginAddMenu();
        $('plugin-add-toggle').focus();
        toast(btn.dataset.kind === 'agent' ? 'Agent 创造模式在真实客户端中打开' : '安装第三方插件入口在真实客户端中打开');
        return;
      }
      if (action === 'choose-plugin-market') {
        state.pluginMarket = btn.dataset.market;
        const market = pluginMarkets.find((item) => item.id === state.pluginMarket);
        renderPlugins();
        const next = document.querySelector('[data-action="choose-plugin-market"][data-market="' + CSS.escape(state.pluginMarket) + '"]');
        if (next) next.focus();
        toast('已启用 ' + (market ? market.name : '插件市场'));
        return;
      }
      if (action === 'plugin-open-panel' || action === 'plugin-permissions') {
        const plugin = pluginById(btn.dataset.plugin);
        toast((plugin ? '「' + plugin.title + '」' : '') + (action === 'plugin-open-panel' ? '面板在侧边栏中打开' : '权限设置在真实客户端中打开'));
        return;
      }
      if (action === 'plugin-config-open') {
        const config = builtinPluginConfigs.find((item) => item.id === btn.dataset.config);
        toast(config ? '「' + config.title + '」配置在真实客户端中打开' : '配置面板在真实客户端中打开');
        return;
      }
      if (action === 'plugin-more-experimental') {
        toast('原型里只展示这些实验性插件');
        return;
      }
      if (action === 'plugin-entry-mode') {
        const plugin = pluginById(btn.dataset.plugin);
        if (!plugin || !plugin.detail) return;
        plugin.detail.entrySelected = btn.dataset.mode;
        renderPlugins();
        const next = document.querySelector('[data-action="plugin-entry-mode"][data-plugin="' + CSS.escape(plugin.id) + '"][data-mode="' + CSS.escape(btn.dataset.mode) + '"]');
        if (next) next.focus();
        return;
      }
      if (action === 'plugin-recheck') {
        const plugin = pluginById(btn.dataset.plugin);
        toast(plugin ? '「' + plugin.title + '」已是最新版本' : '已是最新版本');
        return;
      }
      if (action === 'ask-uninstall') {
        const plugin = pluginById(btn.dataset.plugin);
        if (!plugin) return;
        state.pendingUninstall = plugin.id;
        $('uninstall-title').textContent = '卸载「' + plugin.title + '」？';
        $('uninstall-layer').hidden = false;
        const cancel = $('uninstall-layer').querySelector('[data-action="uninstall-cancel"]');
        if (cancel) cancel.focus();
        return;
      }
      if (action === 'uninstall-cancel') {
        $('uninstall-layer').hidden = true;
        const opener = document.querySelector('[data-action="ask-uninstall"]');
        if (opener) opener.focus();
        return;
      }
      if (action === 'uninstall-confirm') {
        const id = state.pendingUninstall;
        const index = installedPlugins.findIndex((plugin) => plugin.id === id);
        $('uninstall-layer').hidden = true;
        state.pendingUninstall = null;
        if (index >= 0) installedPlugins.splice(index, 1);
        state.pluginDetail = null;
        renderPlugins();
        toast('已卸载');
        const nav = document.querySelector('#settings .set-nav[data-tab="plugins"]');
        if (nav) nav.focus();
        return;
      }
      if (action === 'plugin-tab') {
        state.pluginTab = btn.dataset.tab;
        state.pluginDetail = null;
        renderPlugins();
        const body = document.querySelector('#settings .settings-body');
        if (body) body.scrollTop = 0;
        syncChrome();
        return;
      }
      if (action === 'plugin-open') {
        state.pluginDetail = btn.dataset.plugin;
        renderPlugins();
        const body = document.querySelector('#settings .settings-body');
        if (body) body.scrollTop = 0;
        const back = document.querySelector('[data-action="plugin-back"]');
        if (back) back.focus();
        return;
      }
      if (action === 'plugin-back') {
        const id = state.pluginDetail;
        state.pluginDetail = null;
        renderPlugins();
        const opener = id && document.querySelector('[data-action="plugin-open"][data-plugin="' + CSS.escape(id) + '"]');
        if (opener) opener.focus();
        return;
      }
      if (action === 'ask-install') {
        const plugin = pluginById(btn.dataset.plugin);
        if (!plugin || plugin.installed) return;
        state.pendingPlugin = plugin.id;
        $('install-title').textContent = '安装「' + plugin.title + '」？';
        $('install-body').textContent = plugin.title + ' ' + plugin.version + '，作者 ' + plugin.author + '。';
        showDialog($('install-dialog'), btn);
        return;
      }
      if (action === 'close-install') {
        $('install-dialog').close();
        return;
      }
      if (action === 'confirm-install') {
        const plugin = pluginById(state.pendingPlugin);
        state.opener = null;
        $('install-dialog').close();
        if (!plugin) return;
        plugin.installed = true;
        plugin.enabled = true;
        plugin.group = 'installed';
        state.pluginDetail = plugin.id;
        state.pluginTab = 'installed';
        renderPlugins();
        const back = document.querySelector('[data-action="plugin-back"]');
        if (back) back.focus();
        toast('已安装');
        say(plugin.title + ' 已安装');
        return;
      }
      if (action === 'toggle-plugin') {
        const plugin = pluginById(btn.dataset.plugin);
        if (!plugin) return;
        plugin.enabled = !plugin.enabled;
        renderPlugins();
        const next = document.querySelector('[data-action="toggle-plugin"][data-plugin="' + CSS.escape(plugin.id) + '"]');
        if (next) next.focus();
        toast(plugin.enabled ? '已启用' : '已停用');
        return;
      }
      if (action === 'lan-cancel') {
        $('lan-layer').hidden = true;
        $('lan-switch').focus();
        return;
      }
      if (action === 'lan-confirm') {
        state.lan = true;
        $('lan-layer').hidden = true;
        syncBrowser();
        $('lan-switch').focus();
        return;
      }
    });

    sendBtn.addEventListener('click', () => {
      if (state.sending) stopTurn();
      else send();
    });

    composerInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        send();
      }
    });
    composerInput.addEventListener('input', () => {
      grow();
      syncSend();
    });

    $('plugin-search').addEventListener('input', () => {
      state.query = $('plugin-search').value;
      state.pluginDetail = null;
      renderPlugins();
    });

    document.querySelectorAll('input[name="window-mode"]').forEach((input) => {
      input.addEventListener('change', () => {
        if (!input.checked) return;
        state.mode = input.value;
        syncModes();
        syncBrowser();
        const names = { compatibility: '兼容模式', extended: '扩展模式', advanced: '增强模式' };
        $('mode-status').textContent = '已选中' + names[state.mode] + '。真实应用会在重启后生效，此原型只更新当前选择。';
      });
    });

    document.querySelectorAll('input[name="color-theme"]').forEach((input) => {
      input.addEventListener('change', () => {
        if (!input.checked) return;
        applyTheme(input.value);
        $('theme-status').textContent = state.theme === 'dark' ? '已切换为深色模式。' : '已切换为浅色模式。';
      });
    });

    document.querySelectorAll('[data-notify]').forEach((button) => {
      button.addEventListener('click', () => {
        const key = button.dataset.notify;
        state.notify[key] = !state.notify[key];
        syncNotify();
      });
    });

    $('browser-switch').addEventListener('click', () => {
      if (state.mode !== 'compatibility') {
        $('browser-notice').hidden = false;
        return;
      }
      state.openBrowser = !state.openBrowser;
      syncBrowser();
    });

    $('lan-switch').addEventListener('click', () => {
      if (!state.openBrowser) return;
      if (state.lan) {
        state.lan = false;
        syncBrowser();
        return;
      }
      $('lan-layer').hidden = false;
      $('lan-cancel').focus();
    });

    $('port').addEventListener('blur', () => {
      const n = parsePort($('port').value.trim());
      const error = $('port-error');
      if (n === null) {
        error.hidden = false;
        error.textContent = '请输入 1 到 65535 之间的整数。';
        $('port').setAttribute('aria-invalid', 'true');
        return;
      }
      error.hidden = true;
      error.textContent = '';
      $('port').removeAttribute('aria-invalid');
      if (n !== state.port) {
        state.port = n;
        $('port-status').textContent = '端口已记为 ' + n + '。真实应用会重启 Host，此原型只保存在页面里。';
        syncBrowser();
      }
    });

    $('check-updates').addEventListener('click', () => {
      const button = $('check-updates');
      button.disabled = true;
      button.textContent = '正在检查…';
      $('version-status').textContent = '';
      window.setTimeout(() => {
        button.disabled = false;
        button.textContent = '检查更新';
        $('version-status').textContent = '没有发现新版本。当前 Desktop 2.0.18，Harness 0.2.2-rc.5。';
      }, 700);
    });

    $('settings').addEventListener('cancel', (event) => {
      if (state.editing) {
        event.preventDefault();
        const field = state.editing;
        state.editing = '';
        syncPersona();
        const back = document.querySelector('[data-action="settings-edit"][data-field="' + field + '"]');
        if (back) back.focus();
        return;
      }
      const openMenu = document.querySelector('.picker-menu:not([hidden])');
      if (openMenu) {
        event.preventDefault();
        const owner = document.querySelector('[aria-controls="' + CSS.escape(openMenu.id) + '"]');
        closePickers();
        if (owner) owner.focus();
        return;
      }
      if (!$('uninstall-layer').hidden) {
        event.preventDefault();
        $('uninstall-layer').hidden = true;
        state.pendingUninstall = null;
        const opener = document.querySelector('[data-action="ask-uninstall"]');
        if (opener) opener.focus();
        return;
      }
      if (!$('lan-layer').hidden) {
        event.preventDefault();
        $('lan-layer').hidden = true;
      }
    });
    $('settings').addEventListener('close', () => {
      $('lan-layer').hidden = true;
      $('uninstall-layer').hidden = true;
      state.pendingUninstall = null;
      closePluginAddMenu();
      if (state.opener && state.opener.isConnected) {
        const back = state.opener;
        state.opener = null;
        back.focus();
      }
      syncChrome();
    });
    $('install-dialog').addEventListener('close', () => {
      if (state.opener && state.opener.isConnected) {
        const back = state.opener;
        state.opener = null;
        back.focus();
      }
    });

    document.addEventListener('focusout', (event) => {
      const picker = event.target.closest && event.target.closest('.picker');
      if (!picker) return;
      window.setTimeout(() => {
        if (!picker.contains(document.activeElement)) {
          const menu = picker.querySelector('.picker-menu');
          const trigger = picker.querySelector('.picker-trigger');
          if (menu) menu.hidden = true;
          if (trigger) trigger.setAttribute('aria-expanded', 'false');
        }
      }, 0);
    });
    window.addEventListener('resize', () => {
      document.querySelectorAll('.picker-trigger[aria-expanded="true"]').forEach((trigger) => {
        const menu = document.getElementById(trigger.getAttribute('aria-controls'));
        if (menu && !menu.hidden) placeMenu(trigger, menu);
      });
    });
    document.addEventListener('scroll', (event) => {
      const trigger = document.querySelector('.picker-trigger[aria-expanded="true"]');
      if (!trigger) return;
      if (event.target.closest && event.target.closest('.picker-menu')) return;
      const menu = document.getElementById(trigger.getAttribute('aria-controls'));
      if (menu && !menu.hidden) placeMenu(trigger, menu);
    }, true);

    // 过程列表内部滚动时重新计算两端渐隐。
    transcript.addEventListener('scroll', () => { syncStepProcessEdges(); }, true);

    document.addEventListener('keydown', (event) => {
      const openMenu = document.querySelector('.picker-menu:not([hidden])');
      if (openMenu && event.key === 'Escape') {
        event.preventDefault();
        const owner = document.querySelector('[aria-controls="' + CSS.escape(openMenu.id) + '"]');
        closePickers();
        if (owner) owner.focus();
        return;
      }
      if (openMenu && (event.key === 'ArrowDown' || event.key === 'ArrowUp' || event.key === 'Home' || event.key === 'End')) {
        const options = [...openMenu.querySelectorAll('[role="option"]')];
        if (!options.length) return;
        event.preventDefault();
        const index = options.indexOf(document.activeElement);
        let next = index;
        if (event.key === 'Home') next = 0;
        else if (event.key === 'End') next = options.length - 1;
        else if (event.key === 'ArrowDown') next = Math.min(options.length - 1, (index < 0 ? -1 : index) + 1);
        else next = Math.max(0, (index < 0 ? options.length : index) - 1);
        options[next].focus();
        return;
      }
      const pickerTrigger = event.target.closest && event.target.closest('.picker-trigger');
      if (pickerTrigger && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
        event.preventDefault();
        openPicker(pickerTrigger);
        return;
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'n') {
        event.preventDefault();
        createSession();
      }
      if ((event.ctrlKey || event.metaKey) && event.key === ',') {
        event.preventDefault();
        if (!$('settings').open) openSettings(document.activeElement);
      }
      if (event.key === 'Escape' && !$('plugin-add-menu').hidden) {
        event.preventDefault();
        closePluginAddMenu();
        $('plugin-add-toggle').focus();
        return;
      }
      if (event.key === 'Escape' && !$('app-menu').hidden) {
        event.preventDefault();
        closeAppMenu();
        $('menu-app').focus();
        return;
      }
      if (event.key === 'Escape' && state.drawer && narrowQuery.matches && !$('settings').open && !$('install-dialog').open) {
        state.drawer = false;
        syncChrome();
        $('frame-toggle').focus();
      }
    });

    narrowQuery.addEventListener('change', () => {
      if (!narrowQuery.matches) state.drawer = false;
      syncChrome();
    });

    document.querySelectorAll('[data-commit]').forEach((input) => {
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && input.tagName !== 'TEXTAREA') {
          event.preventDefault();
          commitField(input.dataset.commit);
        }
      });
      input.addEventListener('blur', () => {
        const field = input.dataset.commit;
        window.setTimeout(() => {
          if (state.editing !== field) return;
          commitField(field);
        }, 0);
      });
    });

    applyTheme(state.theme);
    renderAll();
    grow();
    composerInput.focus();

    // 直接看演示：index.html?demo=run 会预填一条消息并走完整个过程。
    if (new URLSearchParams(window.location.search).get('demo') === 'run') {
      composerInput.value = '按参考图把「插件配置」页重构成纵向配置布局';
      grow();
      send();
    }
  </script>
</body>
</html>
