<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UWork 管理端 · 企业智能体运营平台</title>
  <link rel="icon" href="assets/uwork-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/admin.css">
  <link rel="stylesheet" href="assets/legacy-theme.css">
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="uwork-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H7a2 2 0 00-2 2v16a2 2 0 002 2h10a2 2 0 002-2V7z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h6"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.5.5l2-2a5 5 0 00-7-7l-1.2 1.2"/><path d="M14 11a5 5 0 00-7.5-.5l-2 2a5 5 0 007 7l1.2-1.2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3 1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9 1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 00-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0014.5 4.5L20 16"/><path d="M20 20v-4h-4"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M5 17h14l-2-5V4H7v8z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 5.5a3.2 3.2 0 010 6.2M18 14.5c2.2.6 3.5 2.3 3.5 5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 014.5 6H9l2 2h8.5A1.5 1.5 0 0121 9.5v8A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5z"/><path d="M12 11v5M9.5 13.5h5"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.4-3 8.1-7 9.5-4-1.4-7-5.1-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 6.5"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l2.5 2.5L16 9"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10" rx="2"/><path d="M8 10V7a4 4 0 118 0v3"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 9v5M12 17h.01"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 4l3 3M14 7l3 3"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M9.5 16h5"/><path d="M2 12v3M22 12v3"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2M10 21v-3h4v3"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2M3 12h18"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-8 8H5l-2 2V12a8 8 0 018-8h2a8 8 0 018 8z"/><path d="M8 11h8M8 15h5"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-7 5 14 2.5-7h4"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></symbol>
  </svg>

  <div class="admin" id="admin">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="url(#uwork-grad)"/><path d="M13 10v11a7 7 0 0014 0V10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="30.5" cy="10.5" r="2.2" fill="#a9e4ff"/></svg></span>
        <span class="brand-copy"><b>UWork</b><small>管理端</small></span>
        <span class="brand-tag">v1.5</span>
      </div>

      <div class="side-scroll">
        <p class="side-caption">内容运营</p>
        <button type="button" class="nav-item" data-view="kb"><svg class="icon"><use href="#i-book"/></svg><span>知识库</span><span class="nav-count" id="nav-kb-count">7</span></button>
        <button type="button" class="nav-item" data-view="templates"><svg class="icon"><use href="#i-file"/></svg><span>文档模板</span><span class="nav-count" id="nav-tpl-count">13</span></button>
        <p class="side-caption">能力配置</p>
        <button type="button" class="nav-item" data-view="models"><svg class="icon"><use href="#i-cpu"/></svg><span>模型管理</span></button>
        <button type="button" class="nav-item" data-view="agent-perms"><svg class="icon"><use href="#i-bot"/></svg><span>智能体权限</span><span class="nav-count" id="nav-agent-count">4</span></button>
        <button type="button" class="nav-item" data-view="skills"><svg class="icon"><use href="#i-sparkles"/></svg><span>技能管理</span></button>
        <button type="button" class="nav-item" data-view="connectors"><svg class="icon"><use href="#i-link"/></svg><span>连接器管理</span></button>
        <button type="button" class="nav-item" data-view="updates"><svg class="icon"><use href="#i-download"/></svg><span>软件更新</span></button>

        <p class="side-caption">平台治理</p>
        <button type="button" class="nav-item" data-view="sys-notices"><svg class="icon"><use href="#i-message"/></svg><span>通知公告</span></button>
        <button type="button" class="nav-item" data-view="sys-audit"><svg class="icon"><use href="#i-activity"/></svg><span>审计日志</span></button>
        <button type="button" class="nav-item nav-parent" id="system-toggle" data-action="toggle-system" aria-expanded="true">
          <svg class="icon"><use href="#i-settings"/></svg><span>系统管理</span>
          <svg class="icon nav-chev"><use href="#i-chevron-down"/></svg>
        </button>
        <div class="sub-nav" id="system-nav">
          <button type="button" class="sub-item" data-view="sys-users">用户管理</button>
          <button type="button" class="sub-item" data-view="sys-roles">角色管理</button>
          <button type="button" class="sub-item" data-view="sys-levels">密级管理<span class="hot-dot" title="密级闭环"></span></button>
          <button type="button" class="sub-item" data-view="sys-menus">菜单管理</button>
          <button type="button" class="sub-item" data-view="sys-depts">部门管理</button>
          <button type="button" class="sub-item" data-view="sys-posts">岗位管理</button>
          <button type="button" class="sub-item" data-view="sys-dicts">字典管理</button>
          <button type="button" class="sub-item" data-view="sys-params">参数设置</button>
        </div>
        <div class="side-tip">
          <svg class="icon"><use href="#i-shield"/></svg>
          <div><b>密级闭环已开启</b><small>客户端仅展示用户密级及以下的数据</small></div>
        </div>
      </div>

      <div class="side-user">
        <span class="avatar">管</span>
        <div class="side-user-copy"><b>系统管理员</b><small>信息技术部 · 绝密级</small></div>
        <button type="button" class="icon-btn side-more" data-action="about" aria-label="关于"><svg class="icon"><use href="#i-more"/></svg></button>
      </div>
    </aside>
    <button type="button" class="sidebar-scrim" id="sidebar-scrim" data-action="close-sidebar" hidden aria-label="关闭菜单"></button>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="icon-btn only-mobile" data-action="open-sidebar" aria-label="打开菜单"><svg class="icon"><use href="#i-menu"/></svg></button>
          <nav class="breadcrumb" aria-label="面包屑">
            <span>UWork 管理端</span>
            <svg class="icon sep"><use href="#i-chevron-right"/></svg>
            <span id="crumb-parent">内容运营</span>
            <svg class="icon sep"><use href="#i-chevron-right"/></svg>
            <strong id="crumb-current">知识库</strong>
          </nav>
        </div>
        <div class="topbar-right">
          <button type="button" class="closure-pill" data-action="go-levels"><span class="pulse"></span><svg class="icon"><use href="#i-shield"/></svg>密级闭环已开启</button>
          <button type="button" class="icon-btn" data-action="refresh" aria-label="刷新"><svg class="icon"><use href="#i-refresh"/></svg></button>
          <button type="button" class="icon-btn has-dot" data-action="notice" aria-label="通知"><svg class="icon"><use href="#i-bell"/></svg></button>
          <span class="top-sep"></span>
          <div class="top-user">
            <span class="avatar sm">管</span>
            <span class="top-user-copy"><b>系统管理员</b><small>超级管理员</small></span>
          </div>
        </div>
      </header>

      <div class="tags" id="tags" aria-label="已打开的页面">
        <button type="button" class="tag" data-view="kb">首页</button>
        <span class="tag is-current" id="tag-current">知识库</span>
      </div>

      <div class="content-scroll" id="content-scroll">
        <div class="view-root" id="view-root"></div>
      </div>
    </div>
  </div>

  <!-- 通用表单弹窗 -->
  <dialog class="dialog" id="form-dialog">
    <div class="dialog-head">
      <div><h2 id="form-title">编辑</h2><p id="form-sub"></p></div>
      <button type="button" class="icon-btn" data-action="close-form" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <form id="form-body" class="dialog-form" novalidate>
      <div class="form-fields" id="form-fields"></div>
      <p class="form-error" id="form-error" role="alert" hidden></p>
      <footer class="dialog-foot">
        <span class="form-hint">带 <b>*</b> 为必填项</span>
        <div class="foot-actions">
          <button type="button" class="btn" data-action="close-form">取消</button>
          <button type="submit" class="btn btn-primary" id="form-submit">保存</button>
        </div>
      </footer>
    </form>
  </dialog>

  <!-- 上传弹窗 -->
  <dialog class="dialog" id="upload-dialog">
    <div class="dialog-head">
      <div><h2 id="upload-title">上传资料</h2><p id="upload-sub"></p></div>
      <button type="button" class="icon-btn" data-action="close-upload" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <form id="upload-form" class="dialog-form" novalidate>
      <div class="drop-zone" id="upload-drop">
        <input type="file" id="upload-file" hidden>
        <span class="drop-ico"><svg class="icon"><use href="#i-upload"/></svg></span>
        <b>拖入文件，或点击选择</b>
        <small id="upload-accept-text">支持 PDF、Word、Excel、PPT、TXT、MD、PNG、JPG</small>
        <span class="drop-file" id="upload-file-name" hidden></span>
      </div>
      <label class="field"><span>名称 <i>*</i></span><span class="input-wrap"><input name="name" type="text" maxlength="80" placeholder="默认使用文件名"></span></label>
      <div class="field-row">
        <label class="field" id="upload-folder-field"><span id="upload-folder-label">所属目录</span><span class="input-wrap"><select name="folder" id="upload-folder"></select></span></label>
        <label class="field"><span>数据密级</span><span class="input-wrap"><select name="level" id="upload-level"></select></span></label>
      </div>
      <p class="form-note"><svg class="icon"><use href="#i-shield"/></svg>上传后将继承所选密级，客户端仅对符合密级要求的用户展示。</p>
      <p class="form-error" id="upload-error" role="alert" hidden></p>
      <footer class="dialog-foot">
        <span class="form-hint" id="upload-hint">上传后可在右侧文档列表查看</span>
        <div class="foot-actions">
          <button type="button" class="btn" data-action="close-upload">取消</button>
          <button type="submit" class="btn btn-primary" id="upload-submit">确认上传</button>
        </div>
      </footer>
    </form>
  </dialog>

  <!-- 确认弹窗 -->
  <dialog class="dialog narrow" id="confirm-dialog">
    <div class="dialog-head">
      <div><h2 id="confirm-title">确认操作</h2></div>
      <button type="button" class="icon-btn" data-action="close-confirm" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
    <div class="dialog-body">
      <p id="confirm-message"></p>
      <div class="confirm-warn" id="confirm-warn" hidden></div>
    </div>
    <footer class="dialog-foot">
      <span></span>
      <div class="foot-actions">
        <button type="button" class="btn" id="confirm-cancel" data-action="close-confirm">取消</button>
        <button type="button" class="btn btn-danger" id="confirm-ok">确认删除</button>
      </div>
    </footer>
  </dialog>

  <p class="toast" id="toast" hidden role="status" aria-live="polite"></p>

  <script src="../shared/uwork-data.js"></script>
  <script src="../shared/uwork-store.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
